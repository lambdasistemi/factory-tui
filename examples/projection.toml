# Generic example. Copy to ~/.config/factory-tui/config.toml and edit.
# Without this file, factory-tui shows session → window.

[sessions]
infra = ["0-*"]

[status]
running = ["claude", "codex", "codex-raw"]
idle = ["bash", "zsh", "fish", "sh"]
parked_substring = "PARKED"

[[rule]]
window = "^(?:(?P<project>.+)-)?ms(?P<milestone>[0-9]+)-t(?P<ticket>[0-9]+)-(?P<goal>.+)$"
role = "ticket"

[[rule]]
window = "^(?:(?P<project>.+)-)?ms(?P<milestone>[0-9]+)-(?P<goal>.+)$"
role = "desk"

[[rule]]
window = "^(?:(?P<project>.+)-)?e(?P<epic>[0-9]+)-t(?P<ticket>[0-9]+)-(?P<goal>.+)$"
role = "ticket"

[[rule]]
window = "^(?:(?P<project>.+)-)?e(?P<epic>[0-9]+)-(?P<goal>.+)$"
role = "epic"

[tree]
folders = ["project", "milestone", "epic"]
desk_roles = ["desk"]
inherit_milestone_from_desk = true
