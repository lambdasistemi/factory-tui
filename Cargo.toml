[package]
name = "factory-tui"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Browse the agent factory tree (not the tmux session list)"
publish = false
rust-version = "1.85"

[dependencies]
ratatui = "0.29"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 2
strip = true
