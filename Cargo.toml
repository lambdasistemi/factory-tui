[package]
name = "factory-tui"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Browse the agent factory as a tree of seats"
repository = "https://github.com/lambdasistemi/factory-tui"
publish = false
rust-version = "1.85"

[dependencies]
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 2
strip = true
